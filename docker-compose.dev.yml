services:
  fe-dashboard:
    container_name: fe-client-dev
    image: fe-client:dev

    build:
      context: .
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_ENCRYPT_KEY: ${NEXT_PUBLIC_ENCRYPT_KEY}
        ENCRYPT_SECRET_KEY: ${ENCRYPT_SECRET_KEY}
        NEXT_SITE_BASE_URL: ${NEXT_SITE_BASE_URL}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_IMAGE_HOSTS: ${NEXT_PUBLIC_IMAGE_HOSTS:-}

    # Rahasia runtime — sengaja bukan build arg supaya tidak tersimpan di layer image
    environment:
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      # Sama dengan STOREFRONT_PROXY_SECRET backend; dikirim proxy sebagai X-Storefront-Key
      STOREFRONT_PROXY_SECRET: ${STOREFRONT_PROXY_SECRET:-}
      # Header yang DITIMPA nginx host dengan IP pembeli (`proxy_set_header X-Real-IP $remote_addr;`)
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-x-real-ip}

    networks:
      - pakargaming_network

    # Hanya loopback: storefront dijangkau lewat nginx di host (proxy_pass http://127.0.0.1:3000), bukan
    # langsung dari internet — kalau bisa langsung, header IP pembeli bisa dikarang tanpa ditimpa nginx.
    ports:
      - "127.0.0.1:3000:3000"

    restart: unless-stopped

networks:
  pakargaming_network:
    external: true
