name: Deploy Frontend Client Dev

on:
  push:
    branches:
      - dev

# Default tanpa izin apa pun; tiap job meminta yang ia perlukan saja.
permissions: {}

jobs:
  build-and-push:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push git tag dev-x.y.z
      packages: write # push image ke GHCR
    outputs:
      new_tag: ${{ steps.bump.outputs.new_tag }}
      repo_lower: ${{ steps.repo_lower.outputs.repo }}

    steps:
      # Action dipatok ke commit SHA (tag bisa dipindah pemiliknya); komentar = versinya.
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Lowercase Repo
        id: repo_lower
        run: echo "repo=${GITHUB_REPOSITORY@L}" >> "$GITHUB_OUTPUT"

      - name: Login GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version Bump
        id: bump
        run: |

          LATEST_TAG=$(git describe --tags --match "dev-*" --abbrev=0 2>/dev/null || echo "dev-0.0.0")


          CLEAN_TAG=${LATEST_TAG#dev-}


          IFS='.' read -r major minor patch <<< "$CLEAN_TAG"


          if [ "$patch" -eq 9 ]; then
            minor=$((minor + 1))
            patch=0
          else
            patch=$((patch + 1))
          fi

          NEW_TAG="$major.$minor.$patch"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "🚀 New Dev Version: $NEW_TAG"

      - name: Build & Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # Build record/summary bisa memuat build-arg; jangan diunggah sebagai artifact yang bisa diunduh
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          push: true
          # NEXT_PUBLIC_* di-inline saat build: build-arg yang hilang = fitur mati di image (mis. Turnstile).
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL_DEV }}
            NEXT_PUBLIC_ENCRYPT_KEY=${{ secrets.NEXT_PUBLIC_ENCRYPT_KEY_DEV }}
            NEXT_SITE_BASE_URL=${{ secrets.NEXT_SITE_BASE_URL_DEV }}
            ENCRYPT_SECRET_KEY=${{ secrets.ENCRYPT_SECRET_KEY_DEV }}
            NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID_DEV }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY_DEV }}
            NEXT_PUBLIC_IMAGE_HOSTS=${{ vars.NEXT_PUBLIC_IMAGE_HOSTS_DEV }}

          tags: |
            ghcr.io/${{ steps.repo_lower.outputs.repo }}:dev-latest
            ghcr.io/${{ steps.repo_lower.outputs.repo }}:dev-${{ steps.bump.outputs.new_tag }}

      - name: Create Git Tag
        env:
          TAG: dev-${{ steps.bump.outputs.new_tag }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
          fi

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/dev'
    runs-on: [ self-hosted, dev ]
    # Pasang aturan proteksi (branch dev saja) di Settings → Environments → development
    environment: development
    permissions:
      packages: read # docker login + pull image dari GHCR

    steps:
      - name: Deploy
        # Nilai rahasia lewat env, bukan ${{ }} di dalam script (tidak tersisip ke teks shell).
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          NEW_TAG: dev-${{ needs.build-and-push.outputs.new_tag }}
          ENCRYPT_SECRET_KEY: ${{ secrets.ENCRYPT_SECRET_KEY_DEV }}
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL_DEV }}
          NEXT_PUBLIC_ENCRYPT_KEY: ${{ secrets.NEXT_PUBLIC_ENCRYPT_KEY_DEV }}
          NEXT_SITE_BASE_URL: ${{ secrets.NEXT_SITE_BASE_URL_DEV }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID_DEV }}
          # Opsional (nama sengaja beda): hanya di-export kalau secret-nya ada, supaya nilai yang
          # sudah diisi di .env server tidak tertimpa string kosong.
          IN_STOREFRONT_PROXY_SECRET: ${{ secrets.STOREFRONT_PROXY_SECRET_DEV }}
          IN_TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY_DEV }}
        run: |
          set -e

          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

          cd /opt/dev-deploy/fe-client-dev

          CURRENT_IMAGE=$(docker inspect --format='{{.Config.Image}}' fe-client 2>/dev/null || echo "")
          CURRENT_TAG=$(echo "$CURRENT_IMAGE" | awk -F: '{print $2}')

          echo "Current: ${CURRENT_TAG:-none}"
          echo "New: $NEW_TAG"

          export IMAGE_TAG="$NEW_TAG"
          if [ -n "$IN_STOREFRONT_PROXY_SECRET" ]; then export STOREFRONT_PROXY_SECRET="$IN_STOREFRONT_PROXY_SECRET"; fi
          if [ -n "$IN_TURNSTILE_SECRET_KEY" ]; then export TURNSTILE_SECRET_KEY="$IN_TURNSTILE_SECRET_KEY"; fi

          docker compose pull

          # Jika gagal langsung rollback
          if ! docker compose up -d --remove-orphans; then
            echo "Deploy failed ❌"

            if [ -n "$CURRENT_TAG" ]; then
              echo "Rolling back..."
              export IMAGE_TAG="$CURRENT_TAG"
              docker compose up -d --remove-orphans
              echo "Rollback done 🔄"
            fi

            exit 1
          fi

          docker image prune -f

          echo "Deploy Success 🚀"
